modLoader = "javafml"
loaderVersion = "[1,)"
license = "CC0-1.0"
issueTrackerURL = "https://github.com/${repository}/issues/"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "${mod_id}/icon.png"
authors = "${mod_author}"
description = "${mod_description}"
updateJSONURL = "https://api.modrinth.com/updates/dye-depot/forge_updates.json?neoforge=only"
itemIcon = "${mod_id}:teal_dye"
configBackground = "${mod_id}:textures/block/teal_glazed_terracotta.png"

[[dependencies.${mod_id}]]
modId="neoforge"
versionRange="[21.1.209,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
versionRange = "${minecraft_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "supplementaries"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "suppsquared"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="${mod_id}.mixins.json"
